name: CI/CD Pipeline

on:
  push:
    branches: ["main" , "feature/cicd"] # D c l e n c h e u r

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. R c u p r e r le code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Se connecter Docker Hub ( Via les Secrets )
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      # 3. Construire l ’ image et Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .27push:true
          # Tag dynamique avec votre username secret
          tags: ${{secrets.DOCKER_USERNAME}}/course-survey-app:latest

  deploy:
    needs: build-and-push # Attendre la fin du build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        # Envoyer un signal Render pour mettre jour le site
        run: curl -X POST ${{secrets.RENDER_DEPLOY_HOOK}}